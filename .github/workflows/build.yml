name: Build RassLive APK Small

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Get Packages
        run: flutter pub get

      - name: Build Small APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=./symbols --no-tree-shake-icons

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: rasslive-small-apks
          path: build/app/outputs/flutter-apk/*.apk
